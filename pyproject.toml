[project]
name = "news-briefing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "avata200", email = "avata200ms@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "google-genai>=2.22.0",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
news-briefing = "news_briefing:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
